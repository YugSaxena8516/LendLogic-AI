<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanMatched | Prediction Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>LendLogic<span>AI</span></h1>
            <p>Predict your loan eligibility in seconds</p>
        </header>

        <form id="loanForm">
            <div class="form-grid">
                <div class="input-group">
                    <label>No. of Dependents</label>
                    <input type="number" id="no_of_dependents" required min="0" max="5">
                </div>
                <div class="input-group">
                    <label>Education</label>
                    <select id="education">
                        <option value="1">Graduate</option>
                        <option value="0">Not Graduate</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Self Employed?</label>
                    <select id="self_employed">
                        <option value="1">Yes</option>
                        <option value="0">No</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Annual Income (₹)</label>
                    <input type="number" id="income_annum" required>
                </div>

                <div class="input-group">
                    <label>Loan Amount (₹)</label>
                    <input type="number" id="loan_amount" required>
                </div>
                <div class="input-group">
                    <label>Loan Term (Months)</label>
                    <input type="number" id="loan_term" required>
                </div>
                <div class="input-group">
                    <label>CIBIL Score</label>
                    <input type="number" id="cibil_score" required min="300" max="900">
                </div>

                <div class="input-group">
                    <label>Residential Asset Value (₹)</label>
                    <input type="number" id="residential_assets" required>
                </div>
                <div class="input-group">
                    <label>Commercial Asset Value (₹)</label>
                    <input type="number" id="commercial_assets" required>
                </div>
                <div class="input-group">
                    <label>Luxury Asset Value (₹)</label>
                    <input type="number" id="luxury_assets" required>
                </div>
                <div class="input-group">
                    <label>Bank Asset Value (₹)</label>
                    <input type="number" id="bank_assets" required>
                </div>
            </div>

            <button type="submit" class="btn-predict">Check Eligibility</button>
        </form>

        <div id="result" class="result-box hidden">
            <h2 id="statusTitle"></h2>
            <p id="statusDesc"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
